<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0c1016" />
<title>AI Trade — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #07090d; --bg-1: #0c1016; --bg-2: #131820;
    --border: #1f2731; --text-0: #f1f4f9; --text-1: #a8b2c1; --text-2: #6b7588;
    --accent: #6ea8ff; --purple: #a78bfa; --red: #ef4444;
    --radius-md: 10px; --radius-lg: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100dvh; background: var(--bg-0); color: var(--text-0);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  .wrap {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(110, 168, 255, 0.12), transparent);
  }
  .card {
    width: 100%; max-width: 400px;
    background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 32px 28px 28px;
    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
  }
  h1 { font-size: 22px; margin-bottom: 8px; }
  .subtitle { color: var(--text-2); font-size: 14px; margin-bottom: 28px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--text-1); margin-bottom: 8px; }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 11px 14px; border-radius: var(--radius-md);
    background: var(--bg-2); border: 1px solid var(--border); color: var(--text-0);
    font-family: inherit; font-size: 14px; margin-bottom: 18px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .err {
    background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.35);
    color: #fecaca; font-size: 13px; padding: 10px 12px; border-radius: var(--radius-md); margin-bottom: 18px;
  }
  button[type="submit"] {
    width: 100%; padding: 12px 16px; margin-top: 8px;
    border: none; border-radius: var(--radius-md); cursor: pointer; font-family: inherit;
    font-size: 15px; font-weight: 600;
    background: linear-gradient(135deg, #5b8fd9 0%, var(--purple) 100%);
    color: #07090d;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>AI Trade</h1>
    <p class="subtitle">Sign in to continue.</p>
    {% if error %}
    <div class="err">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      {% if next_url %}
      <input type="hidden" name="next" value="{{ next_url }}" />
      {% endif %}
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autocomplete="username" autofocus />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" />
      <button type="submit">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
